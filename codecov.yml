# Coverage gate: judge the patch, not the whole backlog.
# Legacy coverage is sunk cost; untested new code is the real problem.
coverage:
  status:
    project:
      default:
        target: auto      # never drop below the current baseline
        threshold: 1%     # tolerate 1% jitter so noise does not block merges
    patch:
      default:
        target: 80%       # hard gate on new code
        threshold: 0%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
