                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workflow or run not found
          headers:
            X-Trace-ID:
              description: Trace identifier echoed back to clients. Generated when request does not provide one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The run's WorkflowRun custom resource is missing
          headers:
            X-Trace-ID:
              description: Trace identifier echoed back to clients. Generated when request does not provide one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Minimum seconds until the request may be retried (default 1)
              schema:
                type: string
            X-Trace-ID:
              description: Trace identifier echoed back to clients. Generated when request does not provide one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          headers:
            X-Trace-ID:
              description: Trace identifier echoed back to clients. Generated when request does not provide one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: getHealthz
      summary: Health check
      description: Liveness probe endpoint. Returns HTTP 200 when service is up.
      tags:
      - System
      parameters:
      - name: X-Trace-ID
        in: header
        schema:
          type: string
          maxLength: 128
      responses:
        "200":
          description: Service is healthy
          headers:
            X-Trace-ID:
              description: Trace identifier echoed back to clients. Generated when request does not provide one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: Prometheus scrape endpoint in text exposition format.
      tags:
      - System
      parameters:
      - name: X-Trace-ID
        in: header
        schema:
          type: string
          maxLength: 128
      responses:
        "200":
          description: Metrics payload
          headers:
            X-Trace-ID:
              description: Trace identifier echoed back to clients. Generated when request does not provide one.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
  /openapi.json:
    get:
      operationId: getOpenAPIDocument
      summary: OpenAPI document
      description: Machine-readable OpenAPI 3 document generated from code-first route metadata.
      tags:
      - System
      parameters:
      - name: X-Trace-ID
        in: header
        schema:
          type: string
          maxLength: 128
      responses:
        "200":
          description: OpenAPI 3 document
          headers:
            X-Trace-ID:
              description: Trace identifier echoed back to clients. Generated when request does not provide one.
