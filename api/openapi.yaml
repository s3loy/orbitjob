        in: header
        schema:
          type: string
          maxLength: 128
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          description: Explicit target tenant for human members and platform credentials; required for tenant-scoped operations with a platform key. Tenant credentials may omit it or repeat their own tenant; selecting another tenant is forbidden. Explicit /tenants/{id}/... management routes use the path target instead. Conflicting body/query selectors are refused.
      responses:
        "200":
          description: Account operation completed
          headers:
