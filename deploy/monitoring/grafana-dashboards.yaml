apiVersion: v1
kind: ConfigMap
metadata:
  name: orbitjob-dashboards
  namespace: monitoring
data:
  orbitjob.json: |
    {
      "title": "OrbitJob Soak",
      "uid": "orbitjob-soak",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-9h", "to": "now"},
      "timezone": "browser",
      "panels": [
        {"id": 100, "type": "row", "title": "Overview", "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 1, "type": "stat", "title": "Components up", "gridPos": {"x": 0, "y": 1, "w": 7, "h": 4},
          "targets": [{"refId": "A", "expr": "up{job=~\"orbitjob-.*|cadvisor\"}", "legendFormat": "{{job}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "mappings": []}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "textMode": "value_and_name", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 2, "type": "stat", "title": "Execute rate", "gridPos": {"x": 7, "y": 1, "w": 4, "h": 4},
          "targets": [{"refId": "A", "expr": "sum(rate(orbitjob_executions_total[5m]))"}],
          "fieldConfig": {"defaults": {"unit": "ops", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 3, "type": "stat", "title": "Trigger latency p99", "gridPos": {"x": 11, "y": 1, "w": 4, "h": 4},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(orbitjob_trigger_latency_seconds_bucket[5m]))) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 4, "type": "stat", "title": "RateLimit hits / 5m", "gridPos": {"x": 15, "y": 1, "w": 4, "h": 4},
          "targets": [{"refId": "A", "expr": "sum(increase(orbitjob_ratelimit_hits_total[5m])) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 5, "type": "stat", "title": "Worker pool rejected / 5m", "gridPos": {"x": 19, "y": 1, "w": 5, "h": 4},
          "targets": [{"refId": "A", "expr": "sum(increase(orbitjob_worker_pool_rejected_total[5m])) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},

        {"id": 101, "type": "row", "title": "Soak Progress", "gridPos": {"x": 0, "y": 5, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 6, "type": "stat", "title": "Instances by status", "gridPos": {"x": 0, "y": 6, "w": 6, "h": 6},
          "targets": [{"refId": "A", "expr": "sum by (status) (increase(orbitjob_instances_total[$__range]))", "legendFormat": "{{status}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "fixed"}}, "overrides": [
            {"matcher": {"id": "byName", "options": "success"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]},
            {"matcher": {"id": "byName", "options": "failed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
            {"matcher": {"id": "byName", "options": "running"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "yellow"}}]},
            {"matcher": {"id": "byName", "options": "pending"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}]},
            {"matcher": {"id": "byName", "options": "dispatched"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}}]}
          ]},
          "options": {"colorMode": "background", "graphMode": "none", "orientation": "horizontal", "textMode": "value_and_name", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 7, "type": "timeseries", "title": "Instance transitions /s", "gridPos": {"x": 6, "y": 6, "w": 9, "h": 6},
          "targets": [{"refId": "A", "expr": "sum by (status) (rate(orbitjob_instances_total[5m]))", "legendFormat": "{{status}}"}],
          "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": [
            {"matcher": {"id": "byName", "options": "success"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]},
            {"matcher": {"id": "byName", "options": "failed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}
          ]},
          "options": {"legend": {"displayMode": "table", "placement": "right"}, "tooltip": {"mode": "multi"}}},
        {"id": 8, "type": "timeseries", "title": "Executions by result /s", "gridPos": {"x": 15, "y": 6, "w": 9, "h": 6},
          "targets": [{"refId": "A", "expr": "sum by (result) (rate(orbitjob_executions_total[5m]))", "legendFormat": "{{result}}"}],
          "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": [
            {"matcher": {"id": "byName", "options": "completed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]},
            {"matcher": {"id": "byName", "options": "failed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
            {"matcher": {"id": "byName", "options": "timeout"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]}
          ]},
          "options": {"legend": {"displayMode": "table", "placement": "right"}, "tooltip": {"mode": "multi"}}},

        {"id": 102, "type": "row", "title": "Admin API", "gridPos": {"x": 0, "y": 12, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 9, "type": "timeseries", "title": "Trigger latency quantiles", "gridPos": {"x": 0, "y": 13, "w": 12, "h": 7},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(orbitjob_trigger_latency_seconds_bucket[5m])))", "legendFormat": "p99"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(orbitjob_trigger_latency_seconds_bucket[5m])))", "legendFormat": "p95"},
            {"refId": "C", "expr": "histogram_quantile(0.50, sum by (le) (rate(orbitjob_trigger_latency_seconds_bucket[5m])))", "legendFormat": "p50"}
          ],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": [
            {"matcher": {"id": "byName", "options": "p99"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
            {"matcher": {"id": "byName", "options": "p95"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "yellow"}}]},
            {"matcher": {"id": "byName", "options": "p50"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]}
          ]},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 10, "type": "timeseries", "title": "RateLimit hits /s", "gridPos": {"x": 12, "y": 13, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (endpoint_group) (rate(orbitjob_ratelimit_hits_total[5m])) or vector(0)", "legendFormat": "{{endpoint_group}}"}],
          "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 20, "lineWidth": 2, "showPoints": "never"}, "color": {"mode": "fixed", "fixedColor": "red"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 11, "type": "timeseries", "title": "RateLimit passed /s", "gridPos": {"x": 18, "y": 13, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (endpoint_group) (rate(orbitjob_ratelimit_passed_total[5m]))", "legendFormat": "{{endpoint_group}}"}],
          "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 103, "type": "row", "title": "Scheduler", "gridPos": {"x": 0, "y": 20, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 12, "type": "timeseries", "title": "Queue depth", "gridPos": {"x": 0, "y": 21, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "orbitjob_scheduler_queue_depth{job=\"orbitjob-scheduler\"}", "legendFormat": "depth"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 10}, {"color": "red", "value": 50}]}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 13, "type": "timeseries", "title": "Tick duration p99", "gridPos": {"x": 6, "y": 21, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(orbitjob_scheduler_tick_duration_seconds_bucket{job=\"orbitjob-scheduler\"}[5m])))", "legendFormat": "p99"}],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 14, "type": "timeseries", "title": "Instances created /s", "gridPos": {"x": 12, "y": 21, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "sum(rate(orbitjob_scheduler_instances_created_total{job=\"orbitjob-scheduler\"}[5m]))", "legendFormat": "created"}],
          "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 15, "type": "stat", "title": "Cron errors / Breaker transitions", "gridPos": {"x": 18, "y": 21, "w": 6, "h": 7},
          "targets": [
            {"refId": "A", "expr": "orbitjob_scheduler_cron_errors_total{job=\"orbitjob-scheduler\"} or vector(0)", "legendFormat": "cron errors"},
            {"refId": "B", "expr": "orbitjob_scheduler_breaker_transitions_total{job=\"orbitjob-scheduler\"} or vector(0)", "legendFormat": "breaker transitions"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "orientation": "horizontal", "textMode": "value_and_name", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},

        {"id": 104, "type": "row", "title": "Dispatcher", "gridPos": {"x": 0, "y": 28, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 16, "type": "timeseries", "title": "Queue depth by tenant", "gridPos": {"x": 0, "y": 29, "w": 8, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (tenant_id) (orbitjob_dispatcher_queue_depth)", "legendFormat": "{{tenant_id}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 17, "type": "timeseries", "title": "Dispatch actions /s", "gridPos": {"x": 8, "y": 29, "w": 8, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (action) (rate(orbitjob_dispatcher_dispatch_total[5m]))", "legendFormat": "{{action}}"}],
          "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 18, "type": "timeseries", "title": "Tick duration p99", "gridPos": {"x": 16, "y": 29, "w": 8, "h": 7},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(orbitjob_dispatcher_tick_duration_seconds_bucket[5m])))", "legendFormat": "p99"}],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},

        {"id": 105, "type": "row", "title": "Worker", "gridPos": {"x": 0, "y": 36, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 19, "type": "gauge", "title": "Pool active tasks", "gridPos": {"x": 0, "y": 37, "w": 4, "h": 6},
          "targets": [{"refId": "A", "expr": "sum(orbitjob_worker_pool_active_tasks)"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "max": 14, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 11}, {"color": "red", "value": 14}]}}, "overrides": []},
          "options": {"showThresholdLabels": false, "showThresholdMarkers": true, "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 20, "type": "stat", "title": "In-flight executions", "gridPos": {"x": 4, "y": 37, "w": 4, "h": 6},
          "targets": [{"refId": "A", "expr": "orbitjob_executions_active{job=\"orbitjob-worker\"}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "area", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 21, "type": "timeseries", "title": "Queue depth / Capacity", "gridPos": {"x": 8, "y": 37, "w": 8, "h": 6},
          "targets": [
            {"refId": "A", "expr": "sum(orbitjob_worker_queue_depth) or vector(0)", "legendFormat": "queue depth"},
            {"refId": "B", "expr": "sum(orbitjob_worker_capacity) or vector(0)", "legendFormat": "capacity"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 22, "type": "timeseries", "title": "Handler duration p95", "gridPos": {"x": 16, "y": 37, "w": 8, "h": 6},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le, result_code) (rate(orbitjob_handler_execution_duration_seconds_bucket[5m])))", "legendFormat": "{{result_code}}"}],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},

        {"id": 106, "type": "row", "title": "Runtime", "gridPos": {"x": 0, "y": 43, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 23, "type": "timeseries", "title": "Goroutines", "gridPos": {"x": 0, "y": 44, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "go_goroutines{job=~\"orbitjob-.*\"}", "legendFormat": "{{job}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 24, "type": "timeseries", "title": "Resident memory", "gridPos": {"x": 6, "y": 44, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "process_resident_memory_bytes{job=~\"orbitjob-.*\"}", "legendFormat": "{{job}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 25, "type": "timeseries", "title": "CPU", "gridPos": {"x": 12, "y": 44, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (job) (rate(process_cpu_seconds_total{job=~\"orbitjob-.*\"}[5m]))", "legendFormat": "{{job}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 3, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 26, "type": "timeseries", "title": "Open FDs", "gridPos": {"x": 18, "y": 44, "w": 6, "h": 7},
          "targets": [{"refId": "A", "expr": "process_open_fds{job=~\"orbitjob-.*\"}", "legendFormat": "{{job}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},

        {"id": 107, "type": "row", "title": "Containers", "gridPos": {"x": 0, "y": 51, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 27, "type": "timeseries", "title": "CPU per pod (orbitjob)", "gridPos": {"x": 0, "y": 52, "w": 8, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"orbitjob\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 3, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 28, "type": "timeseries", "title": "Memory per pod (orbitjob)", "gridPos": {"x": 8, "y": 52, "w": 8, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"orbitjob\",container!=\"\"})", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 29, "type": "timeseries", "title": "CPU per pod (orbitjob-tasks)", "gridPos": {"x": 16, "y": 52, "w": 8, "h": 7},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"orbitjob-tasks\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 3, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 8, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},

        {"id": 108, "type": "row", "title": "PostgreSQL", "gridPos": {"x": 0, "y": 59, "w": 24, "h": 1}, "collapsed": false, "panels": []},
        {"id": 30, "type": "stat", "title": "pg_up", "gridPos": {"x": 0, "y": 60, "w": 3, "h": 5},
          "targets": [{"refId": "A", "expr": "pg_up"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 31, "type": "timeseries", "title": "Connections", "gridPos": {"x": 3, "y": 60, "w": 7, "h": 5},
          "targets": [{"refId": "A", "expr": "pg_stat_database_numbackends{datname=\"orbitjob\"}", "legendFormat": "backends"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "max": 100, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 60}, {"color": "red", "value": 90}]}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 32, "type": "timeseries", "title": "Transactions /s", "gridPos": {"x": 10, "y": 60, "w": 7, "h": 5},
          "targets": [{"refId": "A", "expr": "sum(rate(pg_stat_database_xact_commit{datname=\"orbitjob\"}[1m]))", "legendFormat": "commit"}],
          "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 33, "type": "stat", "title": "Deadlocks / 5m", "gridPos": {"x": 17, "y": 60, "w": 3, "h": 5},
          "targets": [{"refId": "A", "expr": "increase(pg_stat_database_deadlocks{datname=\"orbitjob\"}[5m]) or vector(0)"}],
