apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # OrbitJob processes expose /metrics on their health server. The worker
      # does not declare containerPort 6062, so we address each pod by IP:port
      # via kubernetes_sd instead of relying on declared container ports.
      # The `pod` label keeps series stable across pod restarts.
      - job_name: 'orbitjob-admin-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [orbitjob]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: orbitjob-admin-api
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8080
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: 'orbitjob-scheduler'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [orbitjob]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: orbitjob-scheduler
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:6060
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: 'orbitjob-dispatcher'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [orbitjob]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: orbitjob-dispatcher
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:6061
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: 'orbitjob-worker'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [orbitjob]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: orbitjob-worker
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:6062
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: 'orbitjob-postgres'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [orbitjob]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: orbitjob-postgres-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9187
      # Container resources via the apiserver proxy to kubelet's cAdvisor
      # endpoint. kind uses a self-signed kubelet cert.
      - job_name: 'cadvisor'
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total)
            action: keep
          - source_labels: [namespace]
            regex: orbitjob|orbitjob-load|orbitjob-tasks|monitoring
            action: keep
          - source_labels: [container]
            regex: .+
            action: keep
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app: prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=36h
            - --web.enable-lifecycle
          ports: [{containerPort: 9090, name: web}]
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        # emptyDir on purpose: this stack serves loadtest runs only. Deleting
        # the pod (loadtest reset) must clear the TSDB so a new run starts
        # from clean counters — a PVC would silently keep the previous run's
        # history and pollute increase()/rate() windows.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: {app: prometheus}
  ports: [{name: web, port: 9090, targetPort: web}]
