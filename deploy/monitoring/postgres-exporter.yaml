apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitjob-postgres-exporter
  namespace: orbitjob
  labels: {app: orbitjob-postgres-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orbitjob-postgres-exporter}
  template:
    metadata:
      labels: {app: orbitjob-postgres-exporter}
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef: {name: orbitjob-postgres, key: POSTGRES_USER}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: orbitjob-postgres, key: POSTGRES_PASSWORD}
            - name: DATA_SOURCE_URI
              value: "orbitjob-postgres.orbitjob.svc:5432/orbitjob?sslmode=disable"
          ports: [{containerPort: 9187, name: metrics}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: orbitjob-postgres-exporter
  namespace: orbitjob
  labels: {app: orbitjob-postgres-exporter}
spec:
  selector: {app: orbitjob-postgres-exporter}
  ports: [{name: metrics, port: 9187, targetPort: metrics}]
