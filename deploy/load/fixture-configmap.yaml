apiVersion: v1
kind: ConfigMap
metadata:
  name: load-fixture
  namespace: orbitjob-load
data:
  server.py: |
    import hashlib, json, threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlparse

    lock = threading.Lock()
    ledger = {}
    attempts = {}

    class Handler(BaseHTTPRequestHandler):
      def send_json(self, status, body):
        data = json.dumps(body, sort_keys=True).encode()
        self.send_response(status)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(data)))
        self.end_headers()
        self.wfile.write(data)

      def do_GET(self):
        parsed = urlparse(self.path)
        query = parse_qs(parsed.query)
        if parsed.path == "/healthz":
          self.send_json(200, {"status": "ok"})
        elif parsed.path == "/fixtures/json/events.json":
          self.send_json(200, [{"group": "a", "value": i} for i in range(128)])
        elif parsed.path == "/api/pages":
          page = int(query.get("page", ["1"])[0])
          self.send_json(200, {"page": page, "items": list(range((page-1)*25, page*25))})
        elif parsed.path == "/api/fail-then-succeed":
          case = query.get("case_id", ["default"])[0]
          with lock:
            attempts[case] = attempts.get(case, 0) + 1
            n = attempts[case]
          self.send_json(500 if n < 3 else 200, {"attempt": n})
        elif parsed.path == "/ledger":
          case = query.get("case_id", [""])[0]
          self.send_json(200, [v for v in ledger.values() if not case or v["case_id"] == case])
        else:
          self.send_json(404, {"error": "not found"})

      def do_POST(self):
        length = int(self.headers.get("Content-Length", "0"))
        body = json.loads(self.rfile.read(length) or b"{}")
        if self.path in ("/ledger", "/webhook-origin"):
          key = body.get("idempotency_key", hashlib.sha256(json.dumps(body, sort_keys=True).encode()).hexdigest())
          with lock:
            duplicate = key in ledger
            ledger.setdefault(key, {"case_id": body.get("case_id", ""), "operation": body.get("operation", self.path), "idempotency_key": key})
          self.send_json(200 if duplicate else 201, {"duplicate": duplicate, "entry": ledger[key]})
        else:
          self.send_json(404, {"error": "not found"})

      def log_message(self, format, *args):
        return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
