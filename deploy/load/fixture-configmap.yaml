apiVersion: v1
kind: ConfigMap
metadata:
  name: load-fixture
  namespace: orbitjob-load
data:
  server.py: |
    import hashlib, json, ssl, threading, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlparse

    lock = threading.Lock()
    ledger = {}
    attempts = {}

    class Handler(BaseHTTPRequestHandler):
      def send_json(self, status, body, headers=None):
        data = json.dumps(body, sort_keys=True).encode()
        self.send_response(status)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(data)))
        for name, value in (headers or {}).items():
          self.send_header(name, value)
        self.end_headers()
        self.wfile.write(data)

      def bump(self, path, case):
        # Keyed by endpoint as well as case so two families that happen to
        # share a case id cannot spend each other's attempts.
        key = (path, case)
        with lock:
          attempts[key] = attempts.get(key, 0) + 1
          return attempts[key]

      def do_GET(self):
        parsed = urlparse(self.path)
        query = parse_qs(parsed.query)
        # Empty rather than a placeholder: /ledger without a case_id means
        # "every entry", and the verifier reads it exactly that way.
        case = query.get("case_id", [""])[0]
        if parsed.path == "/healthz":
          self.send_json(200, {"status": "ok"})
        elif parsed.path == "/fixtures/json/events.json":
          self.send_json(200, [{"group": "a", "value": i} for i in range(128)])
        elif parsed.path == "/api/pages":
          page = int(query.get("page", ["1"])[0])
          self.send_json(200, {"page": page, "items": list(range((page-1)*25, page*25))})
        elif parsed.path == "/api/always-fail":
          self.send_json(500, {"error": "always fails"})
        elif parsed.path == "/api/fail-then-succeed":
          n = self.bump(parsed.path, case)
          self.send_json(500 if n < 3 else 200, {"attempt": n})
        elif parsed.path == "/api/rate-limit-then-success":
          # 429 is one of the response codes curl --retry treats as transient,
          # so the client backs off and tries again without the endpoint having
          # to fail outright.
          n = self.bump(parsed.path, case)
          if n <= 2:
            self.send_json(429, {"attempt": n}, {"Retry-After": "1"})
          else:
            self.send_json(200, {"attempt": n})
        elif parsed.path == "/api/slow":
          # Held open longer than any client deadline in the scenario, so the
          # timeout comes from the client giving up rather than from an error.
          time.sleep(30)
          self.send_json(200, {"slept": 30})
        elif parsed.path == "/ledger":
          self.send_json(200, [v for v in ledger.values() if not case or v["case_id"] == case])
        else:
          self.send_json(404, {"error": "not found"})

      def do_POST(self):
        length = int(self.headers.get("Content-Length", "0"))
        raw = self.rfile.read(length)
        if self.path == "/api/require-json":
          # Rejects a body that does not claim to be JSON. This is what the
          # invalid-content-type scenario is about; without it the scenario
          # only proved that an unrelated 500 produces a failure.
          content_type = (self.headers.get("Content-Type") or "").split(";")[0].strip()
          if content_type != "application/json":
            self.send_json(415, {"error": "expected application/json", "got": content_type})
          else:
            self.send_json(200, {"accepted": True, "bytes": len(raw)})
          return
        body = json.loads(raw or b"{}")
        if self.path in ("/ledger", "/webhook-origin"):
          key = body.get("idempotency_key", hashlib.sha256(json.dumps(body, sort_keys=True).encode()).hexdigest())
          with lock:
            duplicate = key in ledger
            ledger.setdefault(key, {"case_id": body.get("case_id", ""), "operation": body.get("operation", self.path), "idempotency_key": key})
          self.send_json(200 if duplicate else 201, {"duplicate": duplicate, "entry": ledger[key]})
        else:
          self.send_json(404, {"error": "not found"})

      def log_message(self, format, *args):
        return

    # HTTPS on 8443 for the tls-handshake and tls-json-body families. The
    # certificate is self-signed and regenerated by
    # deploy/load/make-tls-cert.sh; clients use
    # --insecure, so this proves a handshake completes, not that a chain
    # validates. The plain HTTP listener stays the one the workloads and the
    # readiness probe use.
    def serve_tls():
      context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
      context.load_cert_chain("/app/tls/tls.crt", "/app/tls/tls.key")
      server = ThreadingHTTPServer(("0.0.0.0", 8443), Handler)
      server.socket = context.wrap_socket(server.socket, server_side=True)
      server.serve_forever()

    threading.Thread(target=serve_tls, daemon=True).start()
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
