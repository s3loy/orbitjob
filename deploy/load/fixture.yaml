apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-fixture
  namespace: orbitjob-load
  labels: {app: load-fixture}
spec:
  replicas: 2
  selector: {matchLabels: {app: load-fixture}}
  template:
    metadata: {labels: {app: load-fixture}}
    spec:
      containers:
        - name: fixture
          image: docker.io/library/python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
          command: [python, /app/server.py]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap: {name: load-fixture}
---
apiVersion: v1
kind: Service
metadata:
  name: load-fixture
  namespace: orbitjob-load
spec:
  selector: {app: load-fixture}
  ports: [{port: 8080, targetPort: 8080}]
