apiVersion: v1
kind: Namespace
metadata:
  name: orbitjob-load
  labels:
    app.kubernetes.io/managed-by: orbitjob-loadtest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: orbitjob-load-fixtures
  namespace: orbitjob-load
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: orbitjob-load-tasks
  namespace: orbitjob-tasks
spec:
  hard:
    requests.cpu: 1500m
    requests.memory: 1536Mi
    limits.cpu: "5"
    limits.memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: orbitjob-load-task-defaults
  namespace: orbitjob-tasks
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 10m, memory: 16Mi}
      default: {cpu: 500m, memory: 256Mi}
      max: {cpu: 500m, memory: 256Mi}
