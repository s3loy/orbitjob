apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-postgres
  namespace: orbitjob-load
  labels: {app: load-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: load-postgres}}
  template:
    metadata: {labels: {app: load-postgres}}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          env:
            - {name: POSTGRES_DB, value: loadtest}
            - {name: POSTGRES_USER, value: loadtest}
            - {name: POSTGRES_PASSWORD, value: loadtest-local}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, loadtest, -d, loadtest]}
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: load-postgres
  namespace: orbitjob-load
spec:
  selector: {app: load-postgres}
  ports: [{port: 5432, targetPort: 5432}]
