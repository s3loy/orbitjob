# OrbitJob Admin API reverse proxy
# Place at /etc/nginx/sites-available/orbitjob and symlink to sites-enabled.

# Rate limit zones
limit_req_zone $binary_remote_addr zone=orbitjob_write:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=orbitjob_read:10m rate=60r/s;

upstream orbitjob_admin {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name <YOUR_DOMAIN>;

    # Uncomment for TLS (provide your own certs)
    # listen 443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/orbitjob.crt;
    # ssl_certificate_key /etc/ssl/private/orbitjob.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Metrics endpoint — no rate limit
    location /metrics {
        proxy_pass http://orbitjob_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — no rate limit
    location /healthz {
        proxy_pass http://orbitjob_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Write endpoints — strict rate limit
    location ~ ^/api/v1/jobs/?$ {
        limit_req zone=orbitjob_write burst=5 nodelay;
        proxy_pass http://orbitjob_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/jobs/[0-9]+/(trigger|pause|resume)$ {
        limit_req zone=orbitjob_write burst=5 nodelay;
        proxy_pass http://orbitjob_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/instances/[^/]+/cancel$ {
        limit_req zone=orbitjob_write burst=5 nodelay;
        proxy_pass http://orbitjob_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Read endpoints — relaxed rate limit
    location /api/ {
        limit_req zone=orbitjob_read burst=100 nodelay;
        proxy_pass http://orbitjob_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI spec
    location /openapi.json {
        proxy_pass http://orbitjob_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Default
    location / {
        return 404;
    }
}
