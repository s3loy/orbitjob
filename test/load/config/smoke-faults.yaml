# Smoke profile with fault injection.
#
# smoke.yaml declares no faults, so it silently inherits the standard plan whose
# offsets (180-220m) are far past a 30-minute run: the fault path had no
# coverage at all, and two bugs lived in it undetected. This config exercises
# it in half an hour instead of the four the standard profile needs.
#
# The faults sit in the recovery phase so they do not disturb the rate
# measurements the earlier phases exist for.
#
profile: smoke
qualification: false
seed: smoke-1
duration: 30m
minimum_instances: 0
environment:
  docker_cpu: 6
  docker_memory_gib: 8
  kind_nodes: 1
definitions:
  total: 1200
  categories:
    data-processing: 280
    database: 220
    http-webhook: 240
    operations: 140
    failure: 220
    external-probes: 100
  product_trigger_types:
    manual: 840
    cron: 360
  trigger_origins:
    manual: 720
    cron: 360
    webhook: 120
  cron_interval_minutes: 60
# Tenant identifiers are ULIDs, matching tenants.id. Prefix digit marks the
# profile (2=standard, 3=smoke, 4=long) so a tenant created by one profile can
# never be confused with another's.
tenants:
  - 30000000000000000000000001
  - 30000000000000000000000002
  - 30000000000000000000000003
  - 30000000000000000000000004
# 30m smoke: definitions are cycled so the schedule covers the full duration.
# Rates are capped so the run exercises the full trigger->schedule->execute
# chain without overrunning the task namespace quota.
phases:
  - {name: warmup, offset: 0m, duration: 2m, rate_per_minute: 5, max_active: 5}
  - {name: correctness, offset: 2m, duration: 8m, rate_per_minute: 8, max_active: 5}
  - {name: steady, offset: 10m, duration: 6m, rate_per_minute: 15, max_active: 5}
  - {name: ramp, offset: 16m, duration: 6m, rate_per_minute: 25, max_active: 5}
  - {name: peak, offset: 22m, duration: 3m, rate_per_minute: 35, max_active: 5}
  - {name: recovery, offset: 25m, duration: 5m, rate_per_minute: 10, max_active: 5}
burst:
  phase: peak
  offset: 1m
  count: 30
  submit_within: 20s
faults:
  plan:
    - {name: operator, offset: 25m}
    - {name: postgres, offset: 27m}
sampling:
  readiness: 10s
  kubernetes_objects: 15s
  resources: 15s
  prometheus: 15s
  postgres: 30s
  backlog: 30s
  database_size: 5m
