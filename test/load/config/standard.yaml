profile: standard
qualification: true
seed: standard-1
duration: 4h
minimum_instances: 10000
environment:
  docker_cpu: 10
  docker_memory_gib: 8
  kind_nodes: 1
definitions:
  total: 1200
  categories:
    data-processing: 280
    database: 220
    http-webhook: 240
    operations: 140
    failure: 220
    external-probes: 100
  product_trigger_types:
    manual: 840
    cron: 360
  trigger_origins:
    manual: 720
    cron: 360
    webhook: 120
  cron_interval_minutes: 10
# Tenant identifiers are ULIDs, matching tenants.id. Prefix digit marks the
# profile (2=standard, 3=smoke, 4=long) so a tenant created by one profile can
# never be confused with another's.
tenants:
  - 20000000000000000000000001
  - 20000000000000000000000002
  - 20000000000000000000000003
  - 20000000000000000000000004
# 4h qualification: definitions are cycled so the schedule covers the full
# duration. Cron jobs fire every 10 minutes to provide a steady baseline;
# manual triggers provide burst and recovery shapes.
phases:
  - {name: warmup, offset: 0m, duration: 10m, rate_per_minute: 5, max_active: 20}
  - {name: correctness, offset: 10m, duration: 30m, rate_per_minute: 10, max_active: 20}
  - {name: steady, offset: 40m, duration: 30m, rate_per_minute: 15, max_active: 30}
  - {name: ramp, offset: 70m, duration: 30m, rate_per_minute: 25, max_active: 50}
  - {name: peak, offset: 100m, duration: 20m, rate_per_minute: 50, max_active: 80}
  - {name: recovery, offset: 120m, duration: 40m, rate_per_minute: 15, max_active: 30}
  - {name: fault-recovery, offset: 160m, duration: 80m, rate_per_minute: 30, max_active: 40}
burst:
  phase: peak
  offset: 5m
  count: 500
  submit_within: 60s
sampling:
  readiness: 10s
  kubernetes_objects: 15s
  resources: 15s
  prometheus: 15s
  postgres: 30s
  backlog: 30s
  database_size: 5m
