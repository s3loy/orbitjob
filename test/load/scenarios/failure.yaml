category: failure
# The bodies the python, alpine, postgres and curl images actually run, each
# named for the outcome it produces: a forced non-zero exit, a cancel while the
# job is still running, a plain success, a message then exit 1, a statement that
# does not parse, and the two retry shapes the fixture serves.
families:
  - {id: forced-exit-nonzero, count: 65, image: python, terminal_state: failed}
  - {id: cancel-while-running, count: 25, image: python, terminal_state: canceled}
  - {id: plain-success, count: 20, image: python}
  - {id: exit-nonzero-message, count: 30, image: alpine, terminal_state: failed}
  - {id: invalid-sql, count: 25, image: postgres, terminal_state: failed}
  - {id: retry-until-success, count: 30, image: curl}
  - {id: retry-exhausted, count: 25, image: curl, terminal_state: failed}
