# OrbitJob — Promtail configuration
# Reads Docker container logs and pushes them to Loki.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Use container name as the instance label
      - source_labels: [__meta_docker_container_name]
        target_label: instance
      # Strip leading / from container name
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      # Include service label from docker-compose
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Drop promtail's own logs to avoid noise
      - source_labels: [__meta_docker_container_name]
        regex: "/promtail.*"
        action: drop
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
      - labels:
          level:
          service:
          container:
