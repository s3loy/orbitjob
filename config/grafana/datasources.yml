# Grafana — Datasource provisioning
# Prometheus metrics datasource. Loki is provisioned only when the logs profile
# gets its own datasource configuration.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations: []
