images:
  admin:
    repository: orbitjob-admin-api
    tag: dev
    pullPolicy: IfNotPresent
  scheduler:
    repository: orbitjob-scheduler
    tag: dev
    pullPolicy: IfNotPresent
  dispatcher:
    repository: orbitjob-dispatcher
    tag: dev
    pullPolicy: IfNotPresent
  bootstrap:
    repository: orbitjob-bootstrap
    tag: dev
    pullPolicy: IfNotPresent
  migrate:
    repository: orbitjob-migrate
    tag: dev
    pullPolicy: IfNotPresent

worker:
  replicas: 1
  image:
    repository: orbitjob-worker
    tag: dev
    pullPolicy: IfNotPresent
  containerExecution:
    namespace: orbitjob-tasks
    requireDigest: false
    ttlSecondsAfterFinished: 600
    serviceAccountName: orbitjob-task
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

runtimeResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

database:
  # `cmd/configure` creates this installation-level Secret once. All replicas
  # inherit it; users do not configure per-process DSNs.
  secretName: orbitjob-database
  keys:
    bootstrapOwner: bootstrap-owner-dsn
    migrator: migrator-dsn
    admin: admin-dsn
    runtime: runtime-dsn
    migratorPassword: migrator-password
    adminPassword: admin-password
    runtimePassword: runtime-password
    bootstrapAPIKey: bootstrap-api-key

adminapi:
  rateLimits:
    readRPS: 100
    writeRPS: 100
    triggerRPS: 500
    adminRPS: 10

bootstrap:
  secretName: orbitjob-bootstrap

taskNamespace:
  create: true
  name: orbitjob-tasks
