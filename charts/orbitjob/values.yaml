logs:
  enabled: true
  image: {repository: orbitjob-log-archive, tag: "", pullPolicy: ""}
  collectorImage: cr.fluentbit.io/fluent/fluent-bit:4.2.3@sha256:a5761fa961cb22dd0875883a4d446b1acd99d4935d77358aa9f50ee177e44fe2
  storage: 10Gi
  storageClass: ""
  declaredBytes: 10737418240
  totalBytes: 7516192768
  runBytes: 33554432
  headBytes: 8388608
  workflowBytes: 134217728
  tenantBytes: 2147483648
  reserveBytes: 1073741824
  collectorBuffer: 128M
  collectorPersistence:
    mode: hostPath
    profile: development
    hostPathBase: /var/lib/orbitjob-collectors
    # These values declare an administrator-provisioned node directory quota.
    # Helm does not create or independently verify a filesystem quota.
    quotaVerified: false
    quotaBytes: 268435456
  tls: {rotate: false}
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  collectorResources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

admission:
  enabled: true
  replicas: 2
  image: {repository: orbitjob-admission, tag: "", pullPolicy: ""}
  # Native writers are trusted administrators with their own review process.
  # Ordinary clients use the checked definition API.
  nativeWriters: []
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

executionNetwork:
  enabled: true
  profile: development
  # This declaration must follow a real allowed/denied connectivity test.
  # Helm cannot establish whether the installed CNI enforces NetworkPolicy.
  enforcementVerified: false
  dnsNamespace: kube-system
  dnsPodLabels: {k8s-app: kube-dns}
  # Each entry grants only the listed CIDRs and destination ports in one
  # managed execution namespace. No external/business access is implicit.
  allowedEgress: []

global:
  # Image registry prefix. Defaults to GHCR; override for Docker Hub or a mirror.
  imageRegistry: ghcr.io/s3loy
  # Blanket override for every component's tag and pullPolicy. Empty means each component decides.
  # Local development, after make docker-build + make kind-load:
  #   --set global.imageTag=dev --set global.imagePullPolicy=Never
  imageTag: ""
  imagePullPolicy: ""

operator:
  # Deploys the reconciler that turns ScheduledJob and JobRun into Kubernetes
  # Jobs. Set false to install the control plane without it.
  enabled: true
  image:
    repository: orbitjob-operator
    tag: ""
    pullPolicy: ""
  # Namespace-to-tenant mapping, "namespace=tenant,namespace=tenant".
  #
  # Required when enabled, and deliberately without a default. The operator
  # reads tenancy from configuration so a workload cannot claim a tenant by
  # writing a Custom Resource; a default here would bind some namespace to some
  # tenant that nobody chose. Install fails with a message naming this value
  # rather than starting a pod that cannot run.
  # Admin uses this same mapping for bounded definition writes and log reads;
  # its exact namespaced grants are in templates/admin-rbac.yaml.
  namespaceTenants: ""
  scheduleIntervalSec: 5
  # Run-history retention sweep cadence in minutes; independent of the
  # schedule loop's seconds-based interval.
  retentionIntervalMin: 5
  healthPort: 8082
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

images:
  admin:
    repository: orbitjob-admin-api
    tag: ""
    pullPolicy: ""
  scheduler:
    repository: orbitjob-scheduler
    tag: ""
    pullPolicy: ""
  bootstrap:
    repository: orbitjob-bootstrap
    tag: ""
    pullPolicy: ""
  migrate:
    repository: orbitjob-migrate
    tag: ""
    pullPolicy: ""

runtimeResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

database:
  # `cmd/configure` creates this installation-level Secret once. All replicas
  # inherit it; users do not configure per-process DSNs.
  secretName: orbitjob-database
  keys:
    bootstrapOwner: bootstrap-owner-dsn
    migrator: migrator-dsn
    admin: admin-dsn
    runtime: runtime-dsn
    migratorPassword: migrator-password
    adminPassword: admin-password
    runtimePassword: runtime-password
    bootstrapAPIKey: bootstrap-api-key

adminapi:
  console:
    # External HTTPS origin for browser authentication, without a path.
    # Empty uses the request host with HTTPS; forwarding headers are not trusted.
    publicOrigin: ""
    # Permit HTTP sessions only on loopback origins for local development.
    allowInsecureLocalhost: false
  service:
    # ClusterIP preserves the internal installation default. NodePort and
    # LoadBalancer expose the entire HTTP service, including operational routes.
    type: ClusterIP
    port: 8080
    # Leave null for allocation by Kubernetes. An explicit port must be in the
    # cluster's configured service-node-port-range.
    nodePort: null
    annotations: {}
  ingress:
    # Requires an existing Ingress controller. Only Console and API routes are
    # forwarded; the chart does not install a controller or issue certificates.
    enabled: false
    className: ""
    # A DNS hostname, or empty for a rule addressed through an IP or gateway.
    host: ""
    annotations: {}
    tls:
      enabled: false
      # Existing kubernetes.io/tls Secret in the release namespace. TLS requires
      # ingress.host; the rendered TLS hosts list uses that same hostname.
      secretName: ""
  rateLimits:
    readRPS: 100
    writeRPS: 100
    triggerRPS: 10

bootstrap:
  # Deprecated and ignored: bootstrap output has always used the fixed
  # bootstrap-api-key name. This old value selected only an incorrect RBAC
  # resourceName; it never configured the writer's delivery target.
  secretName: orbitjob-bootstrap

taskNamespace:
  create: true
  name: orbitjob-tasks
  # The identity container jobs run as. It has no API access on purpose: a job
  # is workload, not control plane.
  serviceAccountName: orbitjob-task
