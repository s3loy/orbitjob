apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitjob-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orbitjob-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orbitjob-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbitjob-worker
    spec:
      serviceAccountName: orbitjob-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: APP_ENV
              value: {{ ternary "production" "development" .Values.worker.containerExecution.requireDigest | quote }}
            - name: WORKER_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.keys.runtime }}
            - name: WORKER_CONTAINER_ENABLED
              value: "true"
            - name: WORKER_CONTAINER_NAMESPACE
              value: {{ .Values.worker.containerExecution.namespace | quote }}
          resources:
{{ toYaml .Values.worker.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
