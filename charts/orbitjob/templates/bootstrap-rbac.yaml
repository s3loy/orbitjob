apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbitjob-bootstrap
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbitjob-bootstrap-secret
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    # The bootstrap writer's fixed delivery target. An existing Secret is
    # verified for retryable delivery, never overwritten.
    resourceNames: ["bootstrap-api-key"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbitjob-bootstrap-secret
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: orbitjob-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbitjob-bootstrap-secret
