{{- $components := dict "admin-api" .Values.images.admin "scheduler" .Values.images.scheduler -}}
{{- range $name, $image := $components }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitjob-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {app.kubernetes.io/name: orbitjob-{{ $name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: orbitjob-{{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orbitjob-{{ $name }}}
    spec:
      {{- if eq $name "admin-api" }}
      serviceAccountName: orbitjob-admin-api
      {{- end }}
      securityContext:
{{ include "orbitjob.podSecurityContext" $ | indent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "orbitjob.image" (dict "root" $ "image" $image) | quote }}
          imagePullPolicy: {{ include "orbitjob.imagePullPolicy" (dict "root" $ "image" $image) }}
          env:
            - name: APP_ENV
              value: production
            - name: {{ if eq $name "admin-api" }}ADMIN_DSN{{ else }}RUNTIME_DSN{{ end }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.secretName }}
                  key: {{ if eq $name "admin-api" }}{{ $.Values.database.keys.admin }}{{ else }}{{ $.Values.database.keys.runtime }}{{ end }}
          {{- if eq $name "admin-api" }}
            - name: RATELIMIT_READ_RPS
              value: {{ $.Values.adminapi.rateLimits.readRPS | quote }}
            - name: RATELIMIT_WRITE_RPS
              value: {{ $.Values.adminapi.rateLimits.writeRPS | quote }}
            - name: RATELIMIT_TRIGGER_RPS
              value: {{ $.Values.adminapi.rateLimits.triggerRPS | quote }}
          {{- else if eq $name "scheduler" }}
            - name: SCHEDULER_HEALTH_PORT
              value: "6060"
          {{- end }}
          ports:
            - name: health
              containerPort: {{ if eq $name "admin-api" }}8080{{ else }}6060{{ end }}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
{{ toYaml $.Values.runtimeResources | indent 12 }}
          securityContext:
{{ include "orbitjob.securityContext" $ | indent 12 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: orbitjob-admin-api
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: orbitjob-admin-api}
  ports:
    - name: http
      port: 8080
      targetPort: health
