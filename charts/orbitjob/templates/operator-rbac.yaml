{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbitjob-operator
  namespace: {{ .Release.Namespace }}
{{ $root := . }}
{{ $mappings := include "orbitjob.operatorNamespaceTenants" . | splitList "," }}
{{ $seenNamespaces := dict }}
{{ range $mapping := $mappings }}
{{ $namespace := index (splitList "=" $mapping) 0 }}
{{ if hasKey $seenNamespaces $namespace }}
{{ fail (printf "operator.namespaceTenants contains duplicate namespace %q" $namespace) }}
{{ end }}
{{ $_ := set $seenNamespaces $namespace true }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbitjob-operator
  namespace: {{ $namespace }}
rules:
  - apiGroups: ["workloads.orbitjob.io"]
    resources: ["scheduledjobs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["workloads.orbitjob.io"]
    resources: ["jobruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["workloads.orbitjob.io"]
    resources: ["workflowjobs", "workflowruns"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["workloads.orbitjob.io"]
    resources: ["scheduledjobs/status", "jobruns/status", "workflowruns/status", "workflowjobs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbitjob-operator
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbitjob-operator
subjects:
  - kind: ServiceAccount
    name: orbitjob-operator
    namespace: {{ $root.Release.Namespace }}
{{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbitjob-operator-leader-election
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbitjob-operator-leader-election
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbitjob-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: orbitjob-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
