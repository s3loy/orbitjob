apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-owner-init-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
{{ include "orbitjob.podSecurityContext" . | indent 8 }}
      containers:
        - name: owner-init
          image: {{ include "orbitjob.image" (dict "root" . "image" .Values.images.migrate) | quote }}
          imagePullPolicy: {{ include "orbitjob.imagePullPolicy" (dict "root" . "image" .Values.images.migrate) }}
          env:
            - name: MIGRATION_MODE
              value: owner-init
            - name: BOOTSTRAP_OWNER_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.keys.bootstrapOwner }}
            - name: MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.keys.migratorPassword }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.keys.adminPassword }}
            - name: RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.keys.runtimePassword }}
          securityContext:
{{ include "orbitjob.securityContext" . | indent 12 }}
