{{- $taskNamespace := .Values.worker.containerExecution.namespace -}}
{{- if .Values.taskNamespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $taskNamespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    orbitjob.io/task-namespace: "true"
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbitjob-worker
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.containerExecution.serviceAccountName }}
  namespace: {{ .Values.worker.containerExecution.namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbitjob-container-executor
  namespace: {{ .Values.worker.containerExecution.namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbitjob-container-executor
  namespace: {{ .Values.worker.containerExecution.namespace }}
subjects:
  - kind: ServiceAccount
    name: orbitjob-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbitjob-container-executor
