{{- if .Values.adminapi.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbitjob-admin-api
  namespace: {{ .Release.Namespace }}
  {{- with .Values.adminapi.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with .Values.adminapi.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.adminapi.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.adminapi.ingress.host | quote }}
      secretName: {{ .Values.adminapi.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    -
      {{- with .Values.adminapi.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range $route := list (dict "path" "/" "type" "Exact") (dict "path" "/console" "type" "Prefix") (dict "path" "/api/v1" "type" "Prefix") (dict "path" "/openapi.json" "type" "Exact") }}
          - path: {{ $route.path }}
            pathType: {{ $route.type }}
            backend:
              service:
                name: orbitjob-admin-api
                port:
                  number: {{ $.Values.adminapi.service.port }}
          {{- end }}
{{- end }}
