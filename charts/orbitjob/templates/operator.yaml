{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitjob-operator
  labels: {app.kubernetes.io/name: orbitjob-operator}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: orbitjob-operator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: orbitjob-operator}}
    spec:
      serviceAccountName: orbitjob-operator
      containers:
        - name: operator
          image: {{ include "orbitjob.image" (dict "root" . "image" .Values.operator.image) | quote }}
          imagePullPolicy: {{ include "orbitjob.imagePullPolicy" (dict "root" . "image" .Values.operator.image) }}
          env:
            - name: OPERATOR_DSN
              valueFrom: {secretKeyRef: {name: orbitjob-database, key: runtime-dsn}}
            - name: OPERATOR_NAMESPACE_TENANTS
              value: {{ include "orbitjob.operatorNamespaceTenants" . | quote }}
            - name: OPERATOR_SCHEDULE_INTERVAL_SEC
              value: {{ .Values.operator.scheduleIntervalSec | quote }}
            - name: OPERATOR_RETENTION_INTERVAL_MIN
              value: {{ .Values.operator.retentionIntervalMin | quote }}
            - name: OPERATOR_HEALTH_PORT
              value: {{ .Values.operator.healthPort | quote }}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: APP_ENV
              value: {{ .Values.appEnv | default "production" | quote }}
          # The health/metrics endpoint. Naming the port lets PodMonitors target
          # "metrics" instead of a numeric containerPort.
          ports:
            - name: metrics
              containerPort: {{ .Values.operator.healthPort }}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
{{- end }}
