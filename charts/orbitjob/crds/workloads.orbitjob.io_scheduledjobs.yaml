apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scheduledjobs.workloads.orbitjob.io
spec:
  group: workloads.orbitjob.io
  scope: Namespaced
  names:
    plural: scheduledjobs
    singular: scheduledjob
    kind: ScheduledJob
    shortNames: [sj]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [schedule, jobTemplate]
              properties:
                schedule: {type: string, minLength: 1}
                suspend: {type: boolean}
                concurrencyPolicy: {type: string, enum: [Allow, Forbid, Replace]}
                misfirePolicy: {type: string, enum: [Skip, FireOnce, CatchUpBounded]}
                # Default deadline copied into each run's own spec.
                timeoutSeconds: {type: integer, format: int32, minimum: 0}
                jobTemplate:
                  type: object
                  required: [image]
                  properties:
                    image: {type: string, minLength: 1}
                    command: {type: array, items: {type: string}}
                    args: {type: array, items: {type: string}}
                    backoffLimit: {type: integer, format: int32, minimum: 0}
                retryPolicy:
                  type: object
                  properties:
                    maxAttempts: {type: integer, format: int32, minimum: 1}
                # Zero means the platform default rather than unlimited: an
                # unbounded history grows the API server and database forever.
                history:
                  type: object
                  properties:
                    successfulRuns: {type: integer, format: int32, minimum: 0}
                    failedRuns: {type: integer, format: int32, minimum: 0}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                activeRevision: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      reason: {type: string}
                      message: {type: string}
                lastScheduleTime: {type: string, format: date-time}
                lastSuccessfulTime: {type: string, format: date-time}
      subresources: {status: {}}
