name: Feature request
description: Propose a concrete change to OrbitJob.
title: ""
labels:
  - kind/feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the operational problem before the proposed implementation. Major interface changes should explain their migration cost.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the observable behavior, not only an implementation sketch.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Note existing workarounds or a smaller change that was considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Call out API, schema, chart, or operational compatibility concerns.
