# Pinning an action to a commit SHA freezes it, and a frozen action never gets
# security fixes. Dependabot is what makes the pinning sustainable rather than a
# one-time hardening that quietly rots.
#
# This file covers both ecosystems on purpose. A config file takes over from the
# repository's web-configured update settings, so listing only github-actions
# here would silently stop the Go module updates that were enabled there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One pull request per week for the routine bumps. Security updates still
      # arrive on their own, immediately.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gomod:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
