# Pre-release images: build the branch's code and push it to GHCR as a
# testable tag, without tagging the repository or waiting for a merge to the
# default branch.
#
# Why this exists: release.yml (the real release path) only fires from the
# default branch, so a feature branch's operator could never be installed
# from a registry — every test install needed a laptop-side docker build and
# kind load. This workflow gives a branch the same artifact the release
# produces, under an unmistakably non-release tag.
#
# Each run publishes `rc-<run number>-<short sha>`. The separate mutable `rc`
# aliases move one component at a time and can differ after interruption; use
# the explicit run tag for an installation. Version tags (v*) stay reserved for
# release.yml; a release must be exactly what the default branch tagged.
#
# Dispatch it from any branch; the run page prints its immutable image tag.

name: Pre-release Images

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verification.yml
    with:
      source_ref: ${{ github.sha }}
      verify_documentation: false
    permissions:
      contents: read

  images:
    name: ${{ matrix.component }}
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: admin-api,  target: admin }
          - { component: scheduler,  target: scheduler }
          - { component: operator,   target: operator }
          - { component: migrate,    target: migrate }
          - { component: bootstrap,  target: bootstrap }
          - { component: log-archive, target: log-archive }
          - { component: admission, target: admission }
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Resolve rc tag
        id: tag
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sha="$(git rev-parse --short=7 HEAD)"
          echo "version=rc-${RUN_NUMBER}-${sha}" >> "$GITHUB_OUTPUT"
          echo "tagging as rc-${RUN_NUMBER}-${sha}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build stages stay on the runner architecture and cross-compile via Go,
      # so no QEMU is needed — same contract as release.yml.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/orbitjob-${{ matrix.component }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=rc-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=rc-${{ matrix.component }}

  publish:
    name: Move rc alias and print install command
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `rc` is a moving alias for "newest pre-release build". It is retagged
      # with a manifest list copy after every component push succeeded.
      # Registry updates are separate: interruption can leave mixed aliases.
      - name: Move rc alias
        env:
          VERSION: ${{ needs.images.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # shellcheck disable=SC2153 # VERSION is injected through the step env above.
          version="$VERSION"
          for component in admin-api scheduler operator migrate bootstrap log-archive admission; do
            image="${REGISTRY}/${owner}/orbitjob-${component}"
            docker buildx imagetools create \
              -t "${image}:rc" "${image}:${version}"
            echo "[OK] ${image}:rc -> ${version}"
          done

      - name: Print install command
        env:
          VERSION: ${{ needs.images.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SOURCE_SHA}"
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"

          Images pushed: ghcr.io/${owner}/orbitjob-*:${VERSION} (alias :rc)
          Source revision: ${SOURCE_SHA}

          Follow the installation guide from this source revision:
          ${source_url}/docs/setup/installation.md
          For an existing database, workload CR or release, follow the upgrade guide first:
          ${source_url}/docs/operations/upgrading.md

          Use the published images above in place of the guide's build-and-push step.
          Run the chart commands from the repository root at the source revision above.
          Before Helm, prepare the release and execution namespaces, PostgreSQL and the
          database Secret in the release namespace (orbitjob-database by default).
          Review a private values file for the real namespace-to-workspace mapping,
          archive storage, execution networking and Console routing. Confirm that every
          node can pull all seven images from ghcr.io/${owner} with the explicit run tag.
          Component-specific tags override global.imageTag. Clear them in the reviewed
          values file or update all seven to ${VERSION}; the command below also pins them.
          Clear or update component repository overrides to the published component names.
          During render review, verify that all seven component image references use
          ghcr.io/${owner}/orbitjob-{component}:${VERSION} from this run.

          After completing the guide's preparation and render review, set RELEASE_NAMESPACE
          and VALUES_FILE to the prepared release namespace and reviewed values file:

          \`\`\`bash
          helm upgrade --install orbitjob ./charts/orbitjob \\
            --namespace "\$RELEASE_NAMESPACE" -f "\$VALUES_FILE" \\
            --set-string global.imageRegistry=ghcr.io/${owner} \\
            --set-string global.imageTag=${VERSION} \\
            --set-string images.admin.tag=${VERSION} \\
            --set-string images.scheduler.tag=${VERSION} \\
            --set-string operator.image.tag=${VERSION} \\
            --set-string images.migrate.tag=${VERSION} \\
            --set-string images.bootstrap.tag=${VERSION} \\
            --set-string logs.image.tag=${VERSION} \\
            --set-string admission.image.tag=${VERSION} \\
            --wait --wait-for-jobs --timeout 10m
          \`\`\`

          Use the explicit run tag above; mutable :rc aliases can contain different component builds.

          EOF
