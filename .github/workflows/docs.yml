name: Documentation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_run:
    workflows: [Benchmark]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          # A late benchmark completion must never publish an older source tree.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install documentation dependencies
        run: npm --prefix site ci --no-audit --no-fund

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the HTTP contract matches this source
        run: make openapi-check

      - name: Locate existing benchmark history
        id: history
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            if git cat-file -e FETCH_HEAD:dev/bench/index.html 2>/dev/null; then
              mkdir -p "$RUNNER_TEMP/benchmark-history"
              git archive FETCH_HEAD dev/bench | tar -x -C "$RUNNER_TEMP/benchmark-history"
              echo "archive=$RUNNER_TEMP/benchmark-history/dev/bench" >> "$GITHUB_OUTPUT"
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi

      - name: Build and check complete documentation
        env:
          BENCHMARK_ARCHIVE: ${{ steps.history.outputs.archive }}
        run: npm --prefix site run build

      - name: Install browser for usability checks
        run: npm --prefix site exec -- playwright install --with-deps chromium

      - name: Verify documentation usability
        run: npm --prefix site run test:browser

      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-browser-diagnostics
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy documentation artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
