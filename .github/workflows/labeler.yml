name: Pull Request Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Path labels
    runs-on: ubuntu-latest
    steps:
      # pull_request_target grants write access for forked pull requests. This
      # workflow only reads the changed-file list through the GitHub API; it
      # never checks out or executes code from the pull request.
      - name: Apply path labels
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
