name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: make test

      - name: Run tests with race detector
        run: make test-race

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The repository uses one attainable per-package bar: 60% for business
      # logic and stores. Declaration-only packages are documented exceptions
      # in scripts/coverage-baseline.txt; every measurable tier package blocks
      # when it falls below the bar.
      - name: Run coverage
        run: make test-cover-check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  openapi:
    name: OpenAPI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate OpenAPI
        run: make openapi-gen

      - name: Check OpenAPI is up to date
        run: make openapi-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, coverage, openapi]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all binaries
        run: make build-all

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: bin/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Images are the release contract: release.yml pushes five targets for
      # linux/amd64 and linux/arm64. This job builds — never pushes — every
      # target for both platforms, so a PR that breaks an image, the arm64
      # cross-compile included, is caught before tag day and not on it. The
      # component list is parsed from the Makefile so CI cannot drift from
      # the dev loop (make docker-build). No QEMU is needed: the Dockerfile
      # pins build stages to the runner architecture and cross-compiles
      # through Go.
      - name: Build all five image targets (amd64 + arm64, no push)
        env:
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          # make assigns with " := ", so the colon sits after whitespace,
          # not flush against the name.
          components="$(sed -n 's/^DOCKER_COMPONENTS[[:space:]]*:=[[:space:]]*//p' Makefile)"
          if [ -z "$components" ]; then
            echo "::error::DOCKER_COMPONENTS not found in Makefile"
            exit 1
          fi
          for pair in $components; do
            name="${pair%%:*}"; target="${pair##*:}"
            echo "==> orbitjob-$name (target $target)"
            docker buildx build --platform "$PLATFORMS" --target "$target" \
              --cache-from "type=gha,scope=docker-$name" \
              --cache-to "type=gha,mode=max,scope=docker-$name" \
              .
          done
