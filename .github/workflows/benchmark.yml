name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.27.1"

jobs:
  # Storing a result writes to the repository, so this job gets exactly one
  # write scope and runs only where that is wanted.
  store:
    name: Store on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: make bench

      - name: Prepare benchmark branch
        id: baseline
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            empty_tree="$(git hash-object -t tree /dev/null)"
            initial_commit="$(git -c user.name=github-action-benchmark \
              -c user.email=github@users.noreply.github.com \
              commit-tree "$empty_tree" -m "initialize benchmark data")"
            git branch gh-pages "$initial_commit"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "go"
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          skip-fetch-gh-pages: ${{ steps.baseline.outputs.exists == 'false' }}
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: "@s3loy"

  # Comparing only reads the repository and comments on the pull request.
  compare:
    name: Compare on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: make bench

      - name: Check for benchmark baseline
        id: baseline
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with main
        if: steps.baseline.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "go"
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-always: true
          save-data-file: false

      - name: Report missing baseline
        if: steps.baseline.outputs.exists == 'false'
        run: echo "No benchmark baseline exists yet; comparison starts after the first push to main." >> "$GITHUB_STEP_SUMMARY"
