# Runs a load-test profile against a real installation on a hosted runner.
#
# This is an advisory operational test, not a required PR or merge check. The
# workflow status says whether the harness completed; the product result is the
# PASS/FAIL/INCONCLUSIVE verdict in the job summary and uploaded result.json.
# Operators decide when that evidence is required for a release.
#
# An operator chooses either hosted profile through workflow_dispatch:
#
#   smoke      ~40 minutes, non-qualifying
#   standard   ~4 hours of schedule plus setup, settle and verify; qualifying
#
# `long` is not offered on hosted runners: it is eight hours of schedule
# alone, and a GitHub-hosted job is hard-capped at 360 minutes (6 hours),
# so 8h cannot fit even before install, settle and verify are counted. The
# soak runs on the always-on dev cluster instead (docs/loadtest-guide.md).
#
name: Load Test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to run"
        required: true
        default: smoke
        type: choice
        options: [smoke, standard]

permissions:
  contents: read

# One profile at a time, and nothing cancelled: a killed profile leaves a
# verdict file that looks like an execution failure.
concurrency:
  group: loadtest
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.1"
  KIND_VERSION: "v0.32.0"
  HELM_VERSION: "v4.2.4"

jobs:
  # Resolve the operator's choice once because timeout-minutes cannot read a
  # job-level env.
  plan:
    name: Resolve profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - id: profile
        env:
          REQUESTED: ${{ inputs.profile }}
        run: echo "profile=$REQUESTED" >> "$GITHUB_OUTPUT"

  loadtest:
    name: Load test (${{ needs.plan.outputs.profile }})
    needs: [plan]
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ needs.plan.outputs.profile }}
    # A profile that runs out of time should say so, not be killed mid-run and
    # leave a verdict file that looks like an execution failure. A hosted job
    # is capped at six hours (360 minutes), so standard's four-hour schedule
    # plus install, settle and verify has to fit under 350.
    timeout-minutes: ${{ needs.plan.outputs.profile == 'standard' && 350 || 90 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Record start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # A kind node plus six container images plus a PostgreSQL takes more room
      # than a hosted runner has free by default. These are the toolchains the
      # runner image ships and this job does not use. This step MUST run
      # before Setup Go: setup installs the toolchain into
      # $AGENT_TOOLSDIRECTORY, and pruning that directory afterwards deletes
      # the Go binary out of the PATH (the first CI smoke run failed here).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/helm /usr/local/bin/helm
          helm version --short

      # scripts/quickstart.sh is the same six steps docs/local-deployment.md
      # walks a human through, so CI and a developer's machine fail in the same
      # place for the same reason.
      - name: Bring up OrbitJob
        run: ./scripts/quickstart.sh

      # The profile arrives through the environment rather than being
      # interpolated into the command, so a value that is not one of the two
      # the input allows can never reach a shell. The script validates it
      # against the same two names as well.
      - name: Run the profile
        run: ./scripts/loadtest-ci.sh "$PROFILE"

      # The run directory holds the manifest, the stats, the verdict and the
      # report. Without it a red job says nothing about which check failed.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loadtest-${{ needs.plan.outputs.profile }}-${{ github.run_id }}
          path: test/load/runs/
          retention-days: 14

      - name: Describe the cluster on failure
        if: failure()
        run: |
          for namespace in orbitjob-system orbitjob orbitjob-tasks orbitjob-load; do
            echo "=== $namespace ==="
            kubectl get pods -n "$namespace" -o wide || true
            kubectl get events -n "$namespace" --sort-by=.lastTimestamp | tail -30 || true
          done
          # Reconcile failures live in pod logs, not in events: a ScheduledJob
          # that never gains an activeRevision, for example, is decided by
          # what the operator logged when it reconciled that CR.
          for component in orbitjob-operator orbitjob-admin-api orbitjob-scheduler; do
            echo "=== logs: $component ==="
            kubectl logs "deployment/$component" -n orbitjob-system --tail=200 --all-containers || true
          done

      # One glanceable block on the run page: profile, duration, what the
      # verifier decided, and where the artifact landed. report.md is embedded
      # so nobody has to download the artifact to learn the outcome.
      - name: Write the job summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          run_dir="$(find test/load/runs -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p/\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
          verdict="none (job ended before the verifier ran)"
          if [ -n "$run_dir" ] && [ -f "${run_dir}result.json" ]; then
            verdict="$(jq -r '.verdict // "unknown"' "${run_dir}result.json")"
          fi
          duration="unknown"
          if [ -n "${STARTED_AT:-}" ]; then
            duration="$(( ($(date +%s) - STARTED_AT) / 60 )) min"
          fi
          {
            echo "## Load test"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Profile | ${PROFILE} |"
            echo "| Verdict | ${verdict} |"
            echo "| Job outcome | ${{ job.status }} |"
            echo "| Duration | ${duration} |"
            echo "| Run artifact | ${RUN_URL} |"
            echo
            if [ -n "$run_dir" ] && [ -f "${run_dir}report.md" ]; then
              echo "### Report"
              echo
              cat "${run_dir}report.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
