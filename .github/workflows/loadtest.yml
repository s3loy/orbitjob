# Runs a load-test profile against a real installation on a hosted runner.
#
# This exists because the profiles were only ever run by hand on one laptop,
# which is the weakest possible evidence: the machine's own sleep behaviour
# silently stretched a 30-minute schedule to nearly two hours, and nobody
# noticed until the timings were compared against the clock.
#
# It is manual for now. A load test is a wall-clock commitment, and putting a
# four-hour job on a schedule before it has been proven once by hand is how a
# repository ends up with a nightly job everybody ignores.
#
#   smoke    ~40 minutes total, non-qualifying
#   standard ~4 hours of schedule plus setup, settle and verify
#
# `long` is not offered: it is eight hours of schedule alone, and a hosted job
# is capped at six.
name: Load Test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to run"
        required: true
        default: smoke
        type: choice
        options: [smoke, standard]

permissions:
  contents: read

concurrency:
  group: loadtest
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.1"
  KIND_VERSION: "v0.32.0"
  HELM_VERSION: "v4.2.4"

jobs:
  loadtest:
    name: Load test (${{ inputs.profile }})
    runs-on: ubuntu-latest
    # A profile that runs out of time should say so, not be killed mid-run and
    # leave a verdict file that looks like an execution failure. A hosted job
    # is capped at six hours, so standard's four-hour schedule plus install,
    # settle and verify has to fit under 350.
    timeout-minutes: ${{ inputs.profile == 'standard' && 350 || 90 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A kind node plus six container images plus a PostgreSQL takes more room
      # than a hosted runner has free by default. These are the toolchains the
      # runner image ships and this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/helm /usr/local/bin/helm
          helm version --short

      # scripts/quickstart.sh is the same six steps docs/local-deployment.md
      # walks a human through, so CI and a developer's machine fail in the same
      # place for the same reason.
      - name: Bring up OrbitJob
        run: ./scripts/quickstart.sh

      # The profile arrives through the environment rather than being
      # interpolated into the command, so a value that is not one of the two
      # the input allows can never reach a shell. The script validates it
      # against the same two names as well.
      - name: Run the profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: ./scripts/loadtest-ci.sh "$PROFILE"

      # The run directory holds the manifest, the stats, the verdict and the
      # report. Without it a red job says nothing about which check failed.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loadtest-${{ inputs.profile }}-${{ github.run_id }}
          path: test/load/runs/
          retention-days: 14

      - name: Describe the cluster on failure
        if: failure()
        run: |
          for namespace in orbitjob-system orbitjob orbitjob-tasks orbitjob-load; do
            echo "=== $namespace ==="
            kubectl get pods -n "$namespace" -o wide || true
            kubectl get events -n "$namespace" --sort-by=.lastTimestamp | tail -30 || true
          done
